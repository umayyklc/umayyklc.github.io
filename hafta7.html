<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafta 7 - Bootstrap ve JS Uygulaması</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </small>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🏠 Ana Sayfa</a>
            <div class="ms-auto d-flex gap-2">
                <button class="btn btn-outline-warning btn-sm" id="btnTema">Temayı Değiştir</button>
            </div>
        </div>
    </nav>

    <section class="bg-primary text-white text-center py-5 shadow-sm">
        <div class="container">
            <h1 class="display-4 fw-bold">Etkinlik Kayıt Paneli</h1>
            <p class="lead">Bootstrap bileşenleri ve JavaScript etkileşimi laboratuvar uygulaması.</p>
            <a href="#formBolumu" class="btn btn-warning btn-lg shadow mt-3">Hemen Kayıt Ol</a>
        </div>
    </section>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0 bg-light text-dark">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Atölye 1</h5>
                        <p class="card-text text-muted">Web geliştirme temelleri ve HTML/CSS dünyasına giriş.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0 bg-light text-dark">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Atölye 2</h5>
                        <p class="card-text text-muted">JavaScript ile DOM manipülasyonu ve etkileşimli sayfalar.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0 bg-light text-dark">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Atölye 3</h5>
                        <p class="card-text text-muted">Bootstrap 5 ile modern ve responsive tasarım teknikleri.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5" id="formBolumu">
        <div class="row justify-content-center">
            <div class="col-md-8 border p-4 rounded-4 shadow bg-white text-dark">
                <h3 class="fw-bold mb-1">Başvuru Formu</h3>
                <p class="text-muted mb-4 small">Lütfen bilgilerinizi eksiksiz doldurunuz.</p>
                
                <form id="kayitFormu">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Ad Soyad</label>
                            <input type="text" class="form-control" id="adSoyad" placeholder="Adınızı giriniz" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">E-posta</label>
                            <input type="email" class="form-control" id="eposta" placeholder="ornek@mail.com" required>
                        </div>
                        <div class="col-12 mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-success px-4">Başvuru Özeti Oluştur</button>
                            <button type="button" id="btnTemizle" class="btn btn-secondary px-4">Formu Temizle</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="row justify-content-center mt-4">
            <div class="col-md-8">
                <div id="ozetAlani" class="alert alert-info text-center shadow-sm">
                    Henüz bir başvuru yapılmadı. Sonuçlar burada görünecek.
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0 small">© 2026 Emine Umay Kılıç - Tüm Hakları Saklıdır.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="hafta7.js"></script>
</body>
</html>
