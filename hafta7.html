<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Uygulaması</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mb-5" id="formBolumu">
    <div class="row justify-content-center">
        <div class="col-md-8 border p-4 rounded-4 shadow bg-light text-dark">
            <h3 class="mb-3 fw-bold">Kayıt Formu</h3>
            <p class="text-muted mb-4">Lütfen bilgilerinizi giriniz. Gönder butonuna bastığınızda özetiniz aşağıda görünecektir.</p>
            
            <form id="kayitFormu">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Ad Soyad:</label>
                        <input type="text" class="form-control" id="adSoyad" placeholder="Adınızı giriniz" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">E-posta:</label>
                        <input type="email" class="form-control" id="eposta" placeholder="ornek@mail.com" required>
                    </div>

                    <div class="col-12 mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-success px-4">Başvuru Özeti Oluştur</button>
                        <button type="button" id="btnTemizle" class="btn btn-secondary px-4">Formu Temizle</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div id="ozetAlani" class="alert alert-info text-center shadow-sm">
                Henüz bir başvuru yapılmadı. Sonuçlar burada görünecek.
            </div>
        </div>
    </div>
</div>
</body>
</html>
